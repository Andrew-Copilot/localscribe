name: Regression tests

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "docs/**"
      - "packaging/**"
      - "README.md"
      - "requirements.txt"
      - ".github/workflows/regression.yml"
      - ".github/workflows/build-installers.yml"
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install existing test runtime dependencies
        run: |
          python3 -m pip install \
            "fastapi>=0.115,<1.0" \
            "python-multipart>=0.0.9" \
            "numpy>=1.23,<3.0" \
            "python-docx>=1.1.0,<2.0"
      - name: Run Python regression suites
        run: |
          for test in \
            test_accessibility \
            test_assets \
            test_box_sync \
            test_deidentification \
            test_engine_fallback \
            test_engine_mlx_normalization \
            test_exporters \
            test_handoff \
            test_health \
            test_privacy_center \
            test_project_archives \
            test_proofread \
            test_range_media \
            test_realign \
            test_recovery \
            test_review \
            test_sensitivity \
            test_speakers \
            test_update_check \
            test_validation \
            test_vocabulary \
            test_winlibs \
            test_workflow_e2e
          do
            python3 -m "tests.${test}"
          done
      - name: Run browser playback logic tests
        run: node tests/test_playback.js
